<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>K72.ca</title>
    <style>
      @font-face {
        font-family: lausanne;
        src: url("./Lausanne-300.woff2") format("woff2");
        font-display: swap;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body,
      html {
        height: 100%;
        width: 100%;
        font-family: lausanne, sans-serif;
      }

      .projects {
        font-size: 10vw;
        text-transform: uppercase;
        margin: 0 12px;
        line-height: 1;
        margin-top: 50vh;
      }

      .projects sup {
        font-size: 5vw;
      }

      .project_container {
        width: 100%;
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
        padding: 0 12px;
      }

      .project_container img {
        width: 100%;
        cursor: pointer;
        transform-origin: bottom;
        transition: border-radius 0.3s ease;
        transform: scaleY(0.5);
      }

      .project_container img:hover {
        border-radius: 16px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1 class="projects">Projects <sup>24</sup></h1>
      <div class="project_container">
        <img src="./marquee-img1.jpg" />
        <img src="./marquee-img2.jpg" />
        <img src="./marquee-img3.jpg" />

        <img src="./marquee-img1.jpg" />
        <img src="./marquee-img2.jpg" />
        <img src="./marquee-img3.jpg" />

        <img src="./marquee-img1.jpg" />
        <img src="./marquee-img2.jpg" />
        <img src="./marquee-img3.jpg" />

        <img src="./marquee-img1.jpg" />
        <img src="./marquee-img2.jpg" />
        <img src="./marquee-img3.jpg" />

        <img src="./marquee-img1.jpg" />
        <img src="./marquee-img2.jpg" />
        <img src="./marquee-img3.jpg" />

        <img src="./marquee-img1.jpg" />
        <img src="./marquee-img2.jpg" />
        <img src="./marquee-img3.jpg" />

        <img src="./marquee-img1.jpg" />
        <img src="./marquee-img2.jpg" />
        <img src="./marquee-img3.jpg" />

        <img src="./marquee-img1.jpg" />
        <img src="./marquee-img2.jpg" />
        <img src="./marquee-img3.jpg" />
      </div>
    </main>

    <!-- Lenis -->
    <script src="https://unpkg.com/@studio-freight/lenis@latest/dist/lenis.min.js"></script>

    <!-- GSAP -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

    <!-- ScrollTrigger -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
    <script>
      // Initialize Lenis
      const lenis = new Lenis({
        duration: 1.2, // smoothness
        easing: (t) => Math.min(1, 1.001 - Math.pow(2, -10 * t)), // default easing
      });

      // RAF for Lenis
      function raf(time) {
        lenis.raf(time);
        requestAnimationFrame(raf);
      }
      requestAnimationFrame(raf);

      // --- GSAP + ScrollTrigger ---
      gsap.registerPlugin(ScrollTrigger);

      // Let ScrollTrigger know about Lenis updates
      lenis.on("scroll", ScrollTrigger.update);

      // Connect Lenis with ScrollTrigger
      ScrollTrigger.scrollerProxy(document.body, {
        scrollTop(value) {
          return arguments.length ? lenis.scrollTo(value) : lenis.scroll;
        },
        getBoundingClientRect() {
          return {
            top: 0,
            left: 0,
            width: window.innerWidth,
            height: window.innerHeight,
          };
        },
      });

      const images = document.querySelectorAll(".project_container img");

      images.forEach((img) => {
        gsap.to(img, {
          scaleY: 1,
          duration: 1,
          stagger: 0.2,
          ease: "power1.inOut",
          scrollTrigger: {
            trigger: img,
            start: "top 60%",
            end: "top 20%",
            scrub: 1,
            markers: false,
          },
        });
      });
    </script>
  </body>
</html>
