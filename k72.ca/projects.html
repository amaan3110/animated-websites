<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>K72.ca</title>
    <style>
      @font-face {
        font-family: lausanne;
        src: url("./Lausanne-300.woff2") format("woff2");
        font-display: swap;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body,
      html {
        height: 100%;
        width: 100%;
        font-family: lausanne, sans-serif;
      }

      .projects {
        font-size: 10vw;
        text-transform: uppercase;
        margin: 0 12px;
        line-height: 1;
        margin-top: 50vh;
      }

      .projects sup {
        font-size: 5vw;
      }

      .project_container {
        width: 100%;
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
        padding: 0 12px;
      }

      .project_container img {
        width: 100%;
        clip-path: inset(30% 0 0 0);
        cursor: pointer;
        transform-origin: top;
      }

      .project_container img:hover {
        border-radius: 16px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1 class="projects">Projects <sup>24</sup></h1>
      <div class="project_container">
        <img src="./marquee-img1.jpg" />
        <img src="./marquee-img2.jpg" />
        <img src="./marquee-img3.jpg" />

        <img src="./marquee-img1.jpg" />
        <img src="./marquee-img2.jpg" />
        <img src="./marquee-img3.jpg" />

        <img src="./marquee-img1.jpg" />
        <img src="./marquee-img2.jpg" />
        <img src="./marquee-img3.jpg" />

        <img src="./marquee-img1.jpg" />
        <img src="./marquee-img2.jpg" />
        <img src="./marquee-img3.jpg" />

        <img src="./marquee-img1.jpg" />
        <img src="./marquee-img2.jpg" />
        <img src="./marquee-img3.jpg" />

        <img src="./marquee-img1.jpg" />
        <img src="./marquee-img2.jpg" />
        <img src="./marquee-img3.jpg" />

        <img src="./marquee-img1.jpg" />
        <img src="./marquee-img2.jpg" />
        <img src="./marquee-img3.jpg" />

        <img src="./marquee-img1.jpg" />
        <img src="./marquee-img2.jpg" />
        <img src="./marquee-img3.jpg" />
      </div>
    </main>

    <script src="https://unpkg.com/lenis@1.3.8/dist/lenis.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
    <script>
      gsap.registerPlugin(ScrollTrigger);
      // Initialize Lenis
      const lenis = new Lenis({
        duration: 1.2, // smoothness (lower = snappier, higher = smoother)
        easing: (t) => Math.min(1, 1.001 - Math.pow(2, -10 * t)), // default easing
        smoothWheel: true,
        smoothTouch: false,
      });

      // Use GSAP ticker to sync Lenis
      gsap.ticker.add((time) => {
        lenis.raf(time * 1000); // gsap gives time in seconds, lenis needs ms
      });

      // Tell ScrollTrigger to update on scroll
      lenis.on("scroll", ScrollTrigger.update);

      const images = document.querySelectorAll(".project_container img");

      let tl = gsap.timeline({
        scrollTrigger: {
          trigger: ".project_container",
          start: "top 40%",
          end: "bottom 20%",
          scrub: true,
          markers: true,
        },
      });

      images.forEach((img, index) => {
        if (index % 2 === 0) {
          tl.to(img, { clipPath: "inset(0 0 0 0)", duration: 1 });
          if (images[index + 1]) {
            tl.to(
              images[index + 1],
              { clipPath: "inset(0 0 0 0)", duration: 1 },
              "<"
            );
          }
        }
      });
    </script>
  </body>
</html>
